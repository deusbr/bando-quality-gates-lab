name: quality-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the fictional example
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Node runtime
        run: node --version
      - name: Run built-in arithmetic tests
        run: node --test
